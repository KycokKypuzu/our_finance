<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Мои финансы{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico">

    <style>
        body { background: #f6f7f9; }
        .page { max-width: 1150px; margin: 40px auto; padding: 0 16px; }
        .card { border: 0; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
        .service-card { transition: transform .12s ease, box-shadow .12s ease; }
        .service-card:hover { transform: translateY(-3px); box-shadow: 0 8px 26px rgba(0,0,0,.10); }
        .main-buttons a { min-width: 240px; padding: 18px; font-size: 20px; }
        table input { min-width: 90px; }
        .table-wrap { overflow-x: auto; }

        .device-card { transition: transform .12s ease, box-shadow .12s ease; }
        .device-card:hover { transform: translateY(-1px); box-shadow: 0 7px 24px rgba(0,0,0,.08); }
        .device-icon {
            width: 46px; height: 46px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            background: #f1f3f5; font-size: 22px; flex: 0 0 auto;
        }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-on .status-dot { background: #198754; }
        .status-off .status-dot { background: #adb5bd; }
        .device-type { font-size: .82rem; color: #6c757d; }
        .device-property { background: #f8f9fa; border-radius: 10px; padding: 10px 12px; }
        .device-property .value { font-weight: 600; }
        .empty-state { padding: 48px 20px; text-align: center; }
        .home-button { min-width: 210px; padding: 16px; }
    </style>
</head>

<body>
<div class="page">
    {% block content %}{% endblock %}
</div>
</body>
</html>
