<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Мои финансы{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}">
    <style>
        body { background: #f6f7f9; }
        .page { max-width: 1150px; margin: 40px auto; }
        .card { border: 0; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
        .main-buttons a { min-width: 240px; padding: 18px; font-size: 20px; }
        table input { min-width: 90px; }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
<div class="page">
    {% block content %}{% endblock %}
</div>
</body>
</html>
