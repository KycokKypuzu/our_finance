{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h1 class="h3 text-center mb-4">Мои финансы</h1>
            <form method="post" action="/login">
                <label class="form-label">Введите имя</label>
                <input name="username" class="form-control form-control-lg mb-3" required autofocus>
                <button class="btn btn-primary w-100 btn-lg">Войти</button>
            </form>

            {% if users %}
            <hr>
            <div class="text-muted mb-2">Ранее использованные имена:</div>
            <div class="d-flex flex-wrap gap-2">
                {% for user in users %}
                <form method="post" action="/login">
                    <input type="hidden" name="username" value="{{ user }}">
                    <button class="btn btn-outline-secondary">{{ user }}</button>
                </form>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
